name: Version Play Store

# Lancement à la main (onglet Actions → « Version Play Store » → Run workflow).
# Produit l'App Bundle (.aab) signé avec la clé d'envoi, sans le déblocage de test,
# à envoyer dans la Play Console. Le fichier est joint à l'exécution (Artifacts), pas publié.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Numéro de version affiché (ex. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé d'envoi
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 absent (voir PLAY_STORE.md)."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Tests et App Bundle signé
        env:
          PLAY_RELEASE: "1"
          # Les numéros Play Store suivent ceux des versions de test (toujours croissants).
          VERSION_CODE: ${{ 100000 + github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.keystore
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :tvhelper:assembleRelease
          mkdir -p app/src/main/assets
          cp tvhelper/build/outputs/apk/release/tvhelper-release.apk app/src/main/assets/tvhelper.apk
          ./gradlew --no-daemon testReleaseUnitTest :app:bundleRelease
          # Vérifie que le paquet est signé avec la clé d'envoi et non la clé de test.
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -q "CN=OmniZap" || {
            echo "::error::App Bundle non signé avec la clé d'envoi."
            exit 1
          }
          cp app/build/outputs/bundle/release/app-release.aab "omnizap-${{ inputs.version_name }}.aab"
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v5
        with:
          name: omnizap-play-${{ inputs.version_name }}
          path: android/omnizap-*.aab
          retention-days: 30
