name: Application Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et compilation de l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          # Application d'aide (liste exacte des applications de la TV), embarquée dans l'APK.
          ./gradlew --no-daemon :tvhelper:assembleRelease
          mkdir -p app/src/main/assets
          cp tvhelper/build/outputs/apk/release/tvhelper-release.apk app/src/main/assets/tvhelper.apk
          ./gradlew --no-daemon testReleaseUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk omnizap.apk
          # Ancien nom conservé pour que les liens déjà partagés fonctionnent.
          cp omnizap.apk telecommande-tv.apk

      - uses: actions/upload-artifact@v5
        with:
          name: omnizap-apk
          path: android/omnizap.apk

      - name: Publier l'APK (dernière version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'API GitHub renvoie parfois une erreur passagère : plusieurs tentatives.
          for attempt in 1 2 3 4; do
            gh release delete android-latest --yes --cleanup-tag || true
            if gh release create android-latest omnizap.apk telecommande-tv.apk \
                --title "OmniZap (dernière version)" \
                --notes "Version de test n°${{ github.run_number }}. Téléchargez omnizap.apk depuis le téléphone puis ouvrez-le pour l'installer." \
                --prerelease \
                --target "$GITHUB_SHA"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1
